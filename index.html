<!DOCTYPE html>
<html>
<head>
<title>Michael Welst</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>



<body>
<!-- NAVIGATION --> 
<nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="#top">
      <img src="resources/logo.svg" alt="MW" width="40" height="40">
      <span class="ml-2 has-text-weight-bold is-size-4">Michael Welst</span>
    </a>

    <!-- Burger button (only visible on small screens) -->
    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div id="navMenu" class="navbar-menu">
    <div class="navbar-end">
      <a class="navbar-item" href="#projects">Projects</a>
      <a class="navbar-item" href="#about">About</a>
      <a class="navbar-item" href="#contact">Contact</a>
    </div>
  </div>
</nav>

<!-- CONTENT --> 
  <section class="hero has-background-grey-lighter py-6" id="Projects">
    <div class="columns has-text-centered">
      <div class="hero-body">
        <p class="title">
          Projects Under Construction
        </p>
        <p class="subtitle">
        </p>
      </div>
    </div>
  </section>

  <section class="hero is-light py-6" id="About">
    <div class="columns has-text-centered">
      <div class="hero-body">
        <p class="title">
          About Under Construction
        </p>
        <p class="subtitle">
        </p>
      </div>
    </div>
  </section>

  <section class="hero has-background-grey-lighter py-6" id="Contact">
    <div class="columns has-text-centered">
      <div class="hero-body">
        <p class="title">
          Contact Under Construction
        </p>
        <p class="subtitle">
        </p>
      </div>
    </div>
  </section>

<!-- FOOTER --> 
  <footer class="footer">
    <div class="columns is-centered">
      <div class="column has-text-centered">
        <img src="resources/logo.svg" width="120"/>
        <p>
          &copy; <span id="year"></span> 
          <strong>Michael Welst</strong> 
        </p>
      </div>
    </div>
  </footer>
<!-- SCRIPT --> 
  <script>
    //Get Year
    document.getElementById("year").textContent = new Date().getFullYear();
    document.addEventListener("DOMContentLoaded", () => {
    const burger = document.querySelector(".navbar-burger");
    const menu = document.getElementById(burger.dataset.target);

    // Open/close when the burger is clicked
    burger.addEventListener("click", () => {
      const isOpen = burger.classList.toggle("is-active");
      menu.classList.toggle("is-active");
      burger.setAttribute("aria-expanded", isOpen);
    });

    // Close the menu after clicking a link (so it doesn't cover the page)
    menu.querySelectorAll(".navbar-item").forEach(item => {
      item.addEventListener("click", () => {
        burger.classList.remove("is-active");
        menu.classList.remove("is-active");
        burger.setAttribute("aria-expanded", "false");
      });
    });
  });
  </script>
</body>
</html>
